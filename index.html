<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coordinate product launch tasks across teams." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Launch Readiness Board</title>
    <script>
      // Apply saved theme/direction/language before first paint to avoid a flash.
      try {
        var d = document.documentElement;
        var saved = localStorage.getItem("theme");
        d.dataset.theme = saved === "light" || saved === "dark" ? saved
          : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        d.dir = localStorage.getItem("dir") === "rtl" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
